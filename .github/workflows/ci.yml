name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DevOps/Aula_07

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: DevOps/Aula_07/package-lock.json

      - name: Install
        run: npm ci

      - name: ESLint
        run: npm run lint

  tests:
    runs-on: ubuntu-latest
    needs: lint
    defaults:
      run:
        working-directory: DevOps/Aula_07

    strategy:
      fail-fast: false
      matrix:
        suite: [unit, integration, performance]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: DevOps/Aula_07/package-lock.json

      - name: Install
        run: npm ci

      - name: Run ${{ matrix.suite }} tests
        run: npm run test:${{ matrix.suite }}

      - name: Upload ${{ matrix.suite }} report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.suite }}
          path: DevOps/Aula_07/reports/${{ matrix.suite }}.xml

  build:
    runs-on: ubuntu-latest
    needs: tests
    defaults:
      run:
        working-directory: DevOps/Aula_07

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: DevOps/Aula_07/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build