name: CI-CD Pipeline - Web App Medicine

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DevOps/Aula_05

    steps:
      # 1. Checkout simples sem histórico complexo do Git
      - name: Checkout do código
        uses: actions/checkout@v4

      # 2. Configuração do Node.js
      - name: Configurar ambiente Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Instalação das dependências
      - name: Instalar dependências
        run: npm install

      # 4. Verificação de Segurança (sem falhar a pipeline se houver avisos)
      - name: Verificação de Segurança (NPM Audit)
        run: npm audit || true

      # 5. Executar Build do projeto
      - name: Executar Build do projeto
        run: npm run build --if-present

      # 6. Upload dos Artefatos de Build
      - name: Upload dos Artefatos de Build
        uses: actions/upload-artifact@v4
        with:
          name: build-web-app-medicine
          path: DevOps/Aula_05/dist/
          retention-days: 5